spring.application.name=order-service
server.port=${PORT:8082}

# Everything comes from the environment (see .env.example).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopdb}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

shoplite.catalog-url=${CATALOG_URL:http://localhost:3000}
shoplite.inventory-url=${INVENTORY_URL:http://localhost:8081}

# Let `docker stop` finish in-flight requests.
server.shutdown=graceful
spring.main.banner-mode=off
