name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - { dir: frontend,          name: frontend }
          - { dir: catalog-service,   name: catalog }
          - { dir: inventory-service, name: inventory }
          - { dir: order-service,     name: orders }
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/shoplite/${{ matrix.name }}:$TAG"
          if aws ecr describe-images --repository-name "shoplite/${{ matrix.name }}" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "$IMAGE already exists, skipping"
            exit 0
          fi
          docker build --provenance=false --platform linux/amd64 -t "$IMAGE" ./${{ matrix.dir }}
          docker push "$IMAGE"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy deploy.sh and init.sql to the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/key.pem "$VM_USER@$VM_HOST" "mkdir -p ~/Shoplite/scripts ~/Shoplite/db"
          scp -i ~/.ssh/key.pem scripts/deploy.sh "$VM_USER@$VM_HOST:~/Shoplite/scripts/deploy.sh"
          scp -i ~/.ssh/key.pem db/init.sql "$VM_USER@$VM_HOST:~/Shoplite/db/init.sql"

      - name: Run deploy.sh on the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          TAG="${GITHUB_SHA::7}"
          ssh -i ~/.ssh/key.pem "$VM_USER@$VM_HOST" \
            "cd ~/Shoplite && chmod +x scripts/deploy.sh && IMAGE_TAG=$TAG ./scripts/deploy.sh"

      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors \
            "https://${{ vars.APP_DOMAIN }}/api/catalog/health"